<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parqueo Inteligente IoT</title>
    <!-- Fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-blue: #007bff;
            --color-verde: #00e676;
            --color-amarillo: #ffea00;
            --color-rojo: #ff1744;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Contenedor de las tarjetas estilo Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            font-size: 16px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        /* Estilo para la Distancia */
        .distancia-valor {
            font-size: 48px;
            font-weight: 700;
        }
        .distancia-unidad {
            font-size: 20px;
            color: var(--text-muted);
        }

        /* Estilo para el Estado */
        .estado-box {
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            border: 2px solid transparent;
        }

        /* Botones de Perfil */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px 0;
            background-color: #2c2c2c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn.active {
            background-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
        }

        /* Switch Toggle para Silencio */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--color-verde);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Asistente de Parqueo</h1>
        <p>Monitoreo en tiempo real</p>
    </div>

    <div class="dashboard">
        
        <!-- Tarjeta: Distancia -->
        <div class="card">
            <h2>Distancia al Muro</h2>
            <div>
                <span class="distancia-valor" id="valDistancia">--</span>
                <span class="distancia-unidad">cm</span>
            </div>
        </div>

        <!-- Tarjeta: Estado Visual -->
        <div class="card">
            <h2>Estado Actual</h2>
            <div class="estado-box" id="valEstado">
                CARGANDO...
            </div>
        </div>

        <!-- Tarjeta: Perfiles -->
        <div class="card">
            <h2>Perfil de Vehículo</h2>
            <div class="btn-group">
                <button class="btn" id="btnMoto" onclick="cambiarPerfil(1)">Moto</button>
                <button class="btn" id="btnSedan" onclick="cambiarPerfil(2)">Sedán</button>
                <button class="btn" id="btnCamioneta" onclick="cambiarPerfil(3)">Pickup</button>
            </div>
        </div>

        <!-- Tarjeta: Silencio -->
        <div class="card">
            <h2>Alarma Sonora</h2>
            <label class="switch">
                <input type="checkbox" id="chkSilencio" onchange="cambiarSilencio(this)">
                <span class="slider"></span>
            </label>
        </div>

    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN: ¡CAMBIA ESTO CON TUS DATOS!
        // ==========================================
        const AUTH_TOKEN = "PaKCqRYN-AQUÍ-VA-EL-RESTO-DE-TU-TOKEN"; 
        
        // Asume los pines de tu imagen (Verifica en Blynk si son correctos)
        const PIN_DISTANCIA = "V1";
        const PIN_ESTADO = "V2";
        const PIN_PERFIL = "V0";
        const PIN_SILENCIO = "V3";

        const URL_BASE = "https://blynk.cloud/external/api";

        // Función para leer los datos del ESP32 constantemente
        async function actualizarDatos() {
            try {
                // 1. Leer Distancia
                let resDist = await fetch(`${URL_BASE}/get?token=${AUTH_TOKEN}&${PIN_DISTANCIA}`);
                let distancia = await resDist.text();
                document.getElementById("valDistancia").innerText = parseFloat(distancia).toFixed(1);

                // 2. Leer Estado (VERDE, AMARILLO, ROJO)
                let resEst = await fetch(`${URL_BASE}/get?token=${AUTH_TOKEN}&${PIN_ESTADO}`);
                let estado = await resEst.text();
                estado = estado.replace(/["\n\r]/g, ''); // Limpiar el string
                
                let boxEstado = document.getElementById("valEstado");
                boxEstado.innerText = estado;

                // Cambiar colores dinámicamente
                if(estado === "VERDE") {
                    boxEstado.style.color = "var(--color-verde)";
                    boxEstado.style.borderColor = "var(--color-verde)";
                } else if(estado === "AMARILLO") {
                    boxEstado.style.color = "var(--color-amarillo)";
                    boxEstado.style.borderColor = "var(--color-amarillo)";
                } else if(estado === "ROJO") {
                    boxEstado.style.color = "var(--color-rojo)";
                    boxEstado.style.borderColor = "var(--color-rojo)";
                    // Efecto de parpadeo de peligro opcional
                    boxEstado.style.boxShadow = "0 0 20px rgba(255,23,68,0.6)"; 
                } else {
                    boxEstado.style.boxShadow = "none";
                }

                // 3. (Opcional) Leer el perfil y el silencio para que la web inicie con los botones correctos
                // Se podría agregar aquí para que la web lea el estado inicial si actualizas la página.

            } catch (error) {
                console.log("Error de conexión con Blynk:", error);
            }
        }

        // Función para enviar comandos al ESP32 (Cambiar Vehículo)
        async function cambiarPerfil(valor) {
            // Actualizar botones visualmente
            document.getElementById("btnMoto").classList.remove("active");
            document.getElementById("btnSedan").classList.remove("active");
            document.getElementById("btnCamioneta").classList.remove("active");
            
            if(valor == 1) document.getElementById("btnMoto").classList.add("active");
            if(valor == 2) document.getElementById("btnSedan").classList.add("active");
            if(valor == 3) document.getElementById("btnCamioneta").classList.add("active");

            // Enviar a Blynk
            fetch(`${URL_BASE}/update?token=${AUTH_TOKEN}&${PIN_PERFIL}=${valor}`);
        }

        // Función para enviar el comando de Silencio
        async function cambiarSilencio(checkbox) {
            let valorEnviado = checkbox.checked ? 1 : 0;
            fetch(`${URL_BASE}/update?token=${AUTH_TOKEN}&${PIN_SILENCIO}=${valorEnviado}`);
        }

        // Ejecutar la actualización de datos cada 1 segundo (1000 milisegundos)
        setInterval(actualizarDatos, 1000);
        actualizarDatos(); // Llamada inicial inmediata
    </script>
</body>
</html>
