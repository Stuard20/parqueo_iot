<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Asistente de Parqueo IoT</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* MODO OSCURO NATIVO (Evita que el navegador rompa los colores) */
        :root {
            --bg: #0f172a;       /* Fondo general oscuro */
            --card: #1e293b;     /* Fondo de las tarjetas */
            --ink: #f8fafc;      /* Texto principal blanco */
            --mut: #94a3b8;      /* Texto secundario gris */
            --ln: #334155;       /* Líneas divisorias */
            --blue: #3b82f6;
            --v: #10b981;        /* Verde semáforo */
            --a: #f59e0b;        /* Amarillo semáforo */
            --r: #ef4444;        /* Rojo semáforo */
            --st: var(--v);
        }

        * { box-sizing: border-box; margin: 0; }
        body { font: 500 15px/1.4 Nunito, system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
        
        header { max-width: 1100px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        header h1 { font-size: 21px; font-weight: 800; flex: 1; }
        button { font: inherit; cursor: pointer; color: inherit; }
        
        .pill { padding: 6px 13px; border-radius: 99px; background: var(--card); border: 1px solid var(--ln); font-weight: 700; font-size: 13px; display: flex; gap: 7px; align-items: center; }
        .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--mut); }
        .pill.on i { background: var(--v); box-shadow: 0 0 8px var(--v); }

        main { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; align-items: start; }
        @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
        
        .card { background: var(--card); border-radius: 22px; border: 1px solid var(--ln); box-shadow: 0 10px 30px rgba(0,0,0,.5); overflow: hidden; }
        .scene { padding: 8px; }
        .scene svg { width: 100%; height: auto; display: block; }
        #car { transition: transform .6s ease; }
        
        .bar { background: var(--st); color: #fff; text-align: center; font-weight: 800; padding: 13px; transition: background .4s; }
        .in { padding: 18px 20px; display: grid; gap: 14px; }
        .row { display: flex; align-items: center; gap: 12px; }
        .badge { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ln); display: grid; place-items: center; font-weight: 800; color: var(--mut); }
        .row h2 { font-size: 18px; font-weight: 800; }
        .mut { color: var(--mut); font-size: 13px; }
        
        .big { font-size: 60px; font-weight: 800; line-height: 1; text-align: center; margin: 10px 0;}
        .big small { font-size: 18px; color: var(--mut); }
        
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { flex: 1; min-width: 76px; padding: 10px; border-radius: 99px; border: 1px solid var(--ln); background: var(--bg); font-weight: 800; transition: 0.3s;}
        .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
        #mute.on { background: var(--r); border-color: var(--r); color: #fff; }
        
        h3 { font-size: 14px; font-weight: 800; text-align: center; margin-top: 10px;}
        .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; color: var(--mut); }
        .cal div { padding: 5px 0; border-radius: 12px; }
        .cal b { display: block; color: var(--ink); font-size: 14px; }
        .cal .today { background: var(--ln); outline: 1px solid var(--blue); }
        .dot { width: 25px; height: 25px; border-radius: 50%; margin: 5px auto 0; background: var(--bg); color: #fff; font-size: 8px; font-weight: 800; display: grid; place-items: center; border: 1px solid var(--ln); }
        
        .leg { text-align: center; font-size: 11px; color: var(--mut); }
        .ks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .ks div { background: var(--bg); border: 1px solid var(--ln); border-radius: 14px; padding: 10px 4px; }
        .ks b { display: block; font-size: 17px; color: var(--blue);}
        .ks span { font-size: 11px; color: var(--mut); }
        
        ul { list-style: none; padding: 0; display: grid; gap: 8px; }
        li { display: flex; gap: 10px; align-items: center; font-size: 13px; background: var(--bg); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--ln);}
        li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
        li span { flex: 1; }
        li em { font-style: normal; color: var(--mut); font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>Asistente de Parqueo</h1>
        <div class="pill" id="st"><i></i><span id="stt">Iniciando...</span></div>
    </header>
    
    <main>
        <!-- Representación Visual (SVG adaptado a modo oscuro) -->
        <section class="card scene">
            <svg viewBox="0 0 720 430" role="img">
                <g transform="translate(230 50) matrix(.866 .5 -.866 .5 0 0)">
                    <rect x="-30" y="-30" width="565" height="230" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
                    <rect x="0" y="0" width="500" height="170" fill="#0f172a" stroke="#334155" stroke-width="2" stroke-dasharray="10 8" />
                    <rect id="zv" y="8" height="154" fill="#10b981" opacity=".15" />
                    <rect id="zy" y="8" height="154" fill="#f59e0b" opacity=".25" />
                    <rect id="zr" y="8" height="154" fill="#ef4444" opacity=".35" />
                    <text x="30" y="118" font-size="72" font-weight="800" fill="#334155">01</text>
                    <rect x="500" y="-12" width="28" height="194" fill="#475569" />
                    <rect x="494" y="75" width="8" height="20" fill="#3b82f6" />
                    <g id="car"></g>
                </g>
            </svg>
        </section>

        <!-- Panel de Control -->
        <section class="card" aria-live="polite">
            <div class="bar" id="bar">Cargando datos...</div>
            <div class="in">
                <div class="row">
                    <div class="badge">P</div>
                    <div>
                        <h2>Plaza de parqueo 01</h2>
                        <div class="mut" id="sub">Ajustando perfil...</div>
                    </div>
                </div>
                
                <div class="big"><span id="dist">--</span> <small>cm al muro</small></div>
                
                <div class="chips">
                    <button class="chip" id="p0">Moto</button>
                    <button class="chip" id="p1">Sedán</button>
                    <button class="chip" id="p2">Pickup</button>
                </div>
                <button class="chip" id="mute">Silenciar alarma</button>
                
                <h3>Esta semana</h3>
                <div class="cal" id="cal"></div>
                <div class="leg">Verde: libre · Amarillo: ocupación corta · Rojo: ocupación larga</div>
                
                <div class="ks">
                    <div><b id="k1">--</b><span>Ocupaciones</span></div>
                    <div><b id="k2">--</b><span>Tiempo medio</span></div>
                    <div><b id="k3">--</b><span>Dist. final</span></div>
                </div>
                
                <h3>Últimos registros</h3>
                <ul id="hist"></ul>
            </div>
        </section>
    </main>

    <script>
        // =========================================================
        // 1. CONFIGURACIÓN PRINCIPAL (AQUÍ PONES EL TOKEN)
        // =========================================================
        const tk = "PaKCqRYN8uo1wimvjSJRBgLjSAZI5dhl; 
        // =========================================================

        const $ = i => document.getElementById(i);
        const API = 'https://blynk.cloud/external/api';
        const PU = [20, 30, 50]; // Distancias de alerta roja por perfil
        const NP = ['Moto', 'Sedán', 'Pickup'];
        const DN = ['LUN', 'MAR', 'MIE', 'JUE', 'VIE', 'SAB', 'DOM'];
        
        // Configuraciones de los dibujos de los vehículos
        const CF = [
            { L: 70, H: 26, c: '#3b82f6' },  // Moto
            { L: 150, H: 72, c: '#a855f7' }, // Sedán
            { L: 180, H: 82, c: '#cbd5e1' }  // Pickup
        ];
        
        let tLoc = 0;
        let lp = -1;
        let H = [];
        let S = { d: null, e: 'VERDE', p: 1, s: 0, on: false };
        
        // Si no cambiaste el token arriba, activa un modo de simulación automático
        let demo = (tk === "PaKCqRYN-PEGAR-AQUI-EL-RESTO-DEL-TOKEN" || tk === "");

        const fmt = s => {
            s = Math.round(s);
            return s < 60 ? s + ' s' : s < 3600 ? Math.floor(s / 60) + ' min' : Math.floor(s / 3600) + ' h';
        };

        // Función para dibujar el carrito en el SVG
        function car(p) {
            const { L, H, c } = CF[p];
            const s = 8;
            const y = 85 - H / 2;
            $('car').innerHTML = `<polygon points="0,${y} ${L},${y} ${L+s},${y+s} ${L+s},${y+H+s} ${s},${y+H+s} 0,${y+H}" fill="#000" opacity=".4"/>` + 
                                 `<rect x="0" y="${y}" width="${L}" height="${H}" rx="${p?10:6}" fill="${c}"/>` + 
                                 (p ? `<rect x="${L*.3}" y="${y+7}" width="${L*.42}" height="${H-14}" rx="6" fill="#1e293b"/>` + 
                                      `<rect x="${L-5}" y="${y+6}" width="5" height="12" fill="#fcd34d"/>` + 
                                      `<rect x="${L-5}" y="${y+H-18}" width="5" height="12" fill="#fcd34d"/>` 
                                    : `<rect x="${L*.35}" y="${y+4}" width="${L*.3}" height="${H-8}" rx="4" fill="#1e293b"/>`);
        }

        // Función para mover el carro según la distancia
        function scene() {
            const U = PU[S.p];
            const L = CF[S.p].L;
            const mx = U * 3.9;
            const k = (486 - L) / mx;
            const d = Math.min(S.d == null || isNaN(S.d) ? mx : S.d, mx);
            
            $('car').style.transform = `translateX(${500 - k * d - L}px)`;
            
            const z = (i, x, w) => { $(i).setAttribute('x', x);$(i).setAttribute('width', Math.max(w, 0)); };
            z('zr', 500 - k * U, k * U);
            z('zy', 500 - k * 3 * U, k * 2 * U);
            z('zv', 14, 500 - k * 3 * U - 14);
        }

        // Función para actualizar los textos y colores
        function ui() {
            document.documentElement.style.setProperty('--st', 'var(' + { VERDE: '--v', AMARILLO: '--a', ROJO: '--r' }[S.e] + ')');
            const f = new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'numeric' });
            
            $('bar').textContent = f[0].toUpperCase() + f.slice(1) + ' · ' + { VERDE: 'Libre', AMARILLO: 'Precaución', ROJO: 'Alto' }[S.e];
            $('dist').textContent = S.d == null \vert{}\vert{} isNaN(S.d) ? '--' : Math.round(S.d);$('sub').textContent = 'Perfil ' + NP[S.p] + ' · Zona roja a los ' + PU[S.p] + ' cm';
            
            [0, 1, 2].forEach(i => $('p' + i).classList.toggle('on', S.p === i));
            $('mute').classList.toggle('on', !!S.s);$('mute').textContent = S.s ? 'Alarma Silenciada' : 'Silenciar alarma';
            
            $('st').className = 'pill' + (S.on ? ' on' : '');
            $('stt').textContent = demo ? 'Modo de Prueba (Pon tu Token)' : S.on ? 'Placa Conectada' : 'Sin Conexión';
            
            if (lp !== S.p) { car(S.p); lp = S.p; }
            scene();
        }

        // Función simuladora si no hay Token
        function simular() {
            const t = Date.now() / 1000;
            const U = PU[S.p];
            S.d = Math.max(3, Math.round(70 + 75 * Math.sin(t / 7)));
            S.e = S.d <= U ? 'ROJO' : S.d <= 3 * U ? 'AMARILLO' : 'VERDE';
            S.on = true;
        }

        // Consulta a la API de Blynk
        async function poll() {
            if (demo) { simular(); } else {
                try {
                    const req = await fetch(`${API}/get?token=${tk}&v0&v1&v2&v3`);
                    if(!req.ok) throw new Error();
                    const j = await req.json();
                    
                    S.d = j.v1 == null ? null : +j.v1; // Asumiendo v1 = Distancia
                    S.e = String(j.v2).replace(/"/g, ''); // Asumiendo v2 = Estado
                    if (!['VERDE', 'AMARILLO', 'ROJO'].includes(S.e)) S.e = 'VERDE';
                    
                    if (Date.now() - tLoc > 3000) {
                        S.p = [0, 1, 2].includes(+j.v0) ? +j.v0 : 1; // Asumiendo v0 = Perfil
                        S.s = +j.v3 ? 1 : 0; // Asumiendo v3 = Silencio
                    }
                    
                    S.on = true;
                } catch (e) {
                    S.on = false;
                }
            }
            ui();
        }

        // Enviar comandos a Blynk
        function send(pin, v) {
            tLoc = Date.now();
            if (!demo) fetch(`${API}/update?token=${tk}&${pin}=${v}`).catch(() => {});
        }

        // Eventos de Botones
        [0, 1, 2].forEach(i => $('p' + i).onclick = () => { S.p = i; send('v0', i); ui(); });$('mute').onclick = () => { S.s = S.s ? 0 : 1; send('v3', S.s); ui(); };

        // Generar historial de ejemplo para el calendario
        function hist() {
            H = []; const n = Date.now();
            for (let i = 0; i < 9; i++) {
                const t = n - (i * .8 + .3) * 864e5 * .9;
                const d = [900, 2400, 7200, 14000][i % 4];
                H.push({ t: new Date(t - d * 1e3), evento: 'ESTACIONADO', perfil: NP[i % 3], dist: 18 + i * 2, dur: 0 }, 
                       { t: new Date(t), evento: 'SALIDA', perfil: NP[i % 3], dist: 120, dur: d });
            }
            H.sort((a, b) => a.t - b.t);
            cal();
        }

        // Dibujar el Calendario
        function cal() {
            const now = new Date(), td = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const m = new Date(td); m.setDate(td.getDate() - ((now.getDay() + 6) % 7));
            const iv = []; let ini = null;
            
            H.forEach(e => {
                if (e.evento === 'ESTACIONADO') ini = e.t;
                else if (e.evento === 'SALIDA') { iv.push([ini || new Date(e.t - e.dur * 1e3), e.t]); ini = null; }
            });
            if (ini) iv.push([ini, now]);
            
            let h = '';
            for (let i = 0; i < 7; i++) {
                const d0 = new Date(m); d0.setDate(m.getDate() + i); let x = '';
                for (let k = 0; k < 2; k++) {
                    const a = +d0 + k * 432e5, b = a + 432e5; let o = 0;
                    iv.forEach(([s, e]) => { o += Math.max(0, Math.min(b, +e) - Math.max(a, +s)); });
                    x += `<div class="dot" style="background:${a > +now ? 'transparent' : o === 0 ? 'var(--v)' : o < 72e5 ? 'var(--a)' : 'var(--r)'}">${k ? 'PM' : 'AM'}</div>`;
                }
                h += `<div class="${+d0 === +td ? 'today' : ''}">${DN[i]}<b>${d0.getDate()}</b>${x}</div>`;
            }
            $('cal').innerHTML = h;
            
            const wk = H.filter(e => e.t >= m), es = wk.filter(e => e.evento === 'ESTACIONADO'), ss = wk.filter(e => e.evento === 'SALIDA');
            const av = (a, f) => a.reduce((s, e) => s + (+e[f] || 0), 0) / a.length;
            $('k1').textContent = es.length; $('k2').textContent = ss.length ? fmt(av(ss, 'dur')) : '--'; $('k3').textContent = es.length ? Math.round(av(es, 'dist')) + ' cm' : '--';
            
            $('hist').innerHTML = H.slice(-6).reverse().map(e => {
                const sa = e.evento === 'SALIDA';
                return `<li><i style="background:var(${sa ? '--v' : '--r'})"></i><span><b>${sa ? 'Salida' : 'Ocupado'}</b> · ${e.perfil}</span><em>${e.t.toLocaleString('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</em></li>`;
            }).join('');
        }

        // Iniciar
        hist();
        poll();
        setInterval(poll, 1000);
    </script>
</body>
</html>
